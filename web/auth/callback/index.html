<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Signing in · Kalpkrut Beats</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0d0b14;
      color: #f5f3ff;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 420px; }
    h1 { font-size: 1.35rem; margin: 0 0 8px; }
    p { color: #b7b0c9; line-height: 1.5; }
    .ok { color: #7dd3a7; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login successful</h1>
    <p class="ok" id="status">Opening Kalpkrut Beats…</p>
    <p>You can safely close this Chrome tab.</p>
  </div>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      var appUrl = 'com.kalpkrut.beats://login-callback' + search + hash;
      try {
        window.location.replace(appUrl);
      } catch (e) {}
      setTimeout(function () {
        document.getElementById('status').textContent =
          'App opened. Close this page for security.';
        try { window.close(); } catch (e) {}
      }, 800);
      setTimeout(function () {
        try { window.close(); } catch (e) {}
      }, 1600);
    })();
  </script>
</body>
</html>
