<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }

        h1 {
            color: #333;
        }

        .video-container {
            margin-top: 20px;
            position: relative;
            display: inline-block;
        }

        .mute-button {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            font-size: 16px;
            border-radius: 5px;
        }

        .mute-button:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        .subscribe-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            color: white;
            background-color: #ff0000;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }

        .subscribe-button:hover {
            background-color: #cc0000;
        }
    </style>
</head>

<body>
    <h1>Welcome to Music API</h1>
    <p>Use this API to get music links.</p>

    <div
        style="margin-top: 30px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; display: inline-block; text-align: left;">
        <h3>Test the API</h3>
        <label for="ytUrl">YouTube URL:</label><br>
        <input type="text" id="ytUrl" placeholder="https://www.youtube.com/watch?v=..."
            style="width: 300px; padding: 8px; margin-top: 5px;"><br><br>

        <label for="mediaType">Type:</label><br>
        <select id="mediaType" style="padding: 8px; margin-top: 5px;">
            <option value="audio">Audio (MP3)</option>
            <option value="video">Video (MP4)</option>
        </select><br><br>

        <button onclick="testApi()"
            style="padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer;">
            Test Download
        </button>

        <div id="resultBox"
            style="margin-top: 20px; font-family: monospace; background: #f4f4f4; padding: 10px; border-radius: 5px; display: none; white-space: pre-wrap; word-wrap: break-word; max-width: 400px;">
        </div>
    </div>

    <script>
        async function testApi() {
            const url = document.getElementById('ytUrl').value;
            const type = document.getElementById('mediaType').value;
            const resultBox = document.getElementById('resultBox');

            if (!url) {
                alert("Please enter a YouTube URL!");
                return;
            }

            resultBox.style.display = "block";
            resultBox.innerText = "Processing... this may take a few seconds.";

            try {
                const response = await fetch(`/download?url=${encodeURIComponent(url)}&type=${type}`);
                const data = await response.json();

                if (response.ok) {
                    resultBox.innerHTML = `<strong>Success!</strong><br><br>File URL: <a href="${data.file_url}" target="_blank">${data.file_url}</a>`;
                } else {
                    resultBox.innerHTML = `<strong>Error!</strong><br><br>${data.error || 'Unknown error'}`;
                }
            } catch (err) {
                resultBox.innerText = `Network Error: ${err.message}`;
            }
        }
    </script>
</body>

</html>
